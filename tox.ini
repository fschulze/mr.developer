[tox]
envlist = py310,py311,py312,py313,py314,py315,flake8

[base]
deps =
    mock
    pytest


[testenv]
commands = py.test --cov {envsitepackagesdir}/mr/developer --cov-report=term --cov-report=html --cov-report=xml {envsitepackagesdir}/mr/developer {posargs}
deps =
    {[base]deps}
    pytest-cov
    configparser: configparser


[testenv:flake8]
commands = flake8 --ignore E501 setup.py src
deps = flake8
skip_install = true


[pytest]
addopts =
    -r a
    --tb=native
    --doctest-modules
    --strict
    -W once::DeprecationWarning
testpaths = src/mr/
