[tox]
envlist = lint,py310,py311,py312,py313,py314,py315

[base]
deps =
    mock
    pytest


[testenv]
commands = py.test --cov {envsitepackagesdir}/mr/developer --cov-report=term --cov-report=html --cov-report=xml {envsitepackagesdir}/mr/developer {posargs}
deps =
    {[base]deps}
    pytest-cov
    configparser: configparser


[testenv:lint]
description = run linters that will help improve the code style
skip_install = true
deps =
    pre-commit
commands =
    pre-commit run -a


[pytest]
addopts =
    -r a
    --tb=native
    --doctest-modules
    --strict
    -W once::DeprecationWarning
testpaths = src/mr/
